[package]
name = "calcard"
description = "iCalendar/JSCalendar and vCard/JSContact parsing, building and conversion library for Rust"
version = "0.4.0"
authors = [ "Stalwart Labs <hello@stalw.art>"]
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/stalwartlabs/calcard"
homepage = "https://github.com/stalwartlabs/calcard"
keywords = ["icalendar", "vcard", "jscalendar", "jscontact", "parser"]
categories = ["date-and-time", "email", "parser-implementations"]
readme = "README.md"
resolver = "2"

[dependencies]
jmap-tools = { version = "0.1.9", optional = true }
ahash = "0.8.11"
jiff = "0.2.37"
hashify = "0.3"
memchr = "2.7"
fearless_simd = "1.0"
mail-builder = { version = "1.0.0", default-features = false }
mail-parser = "0.11"
simdutf8 = "0.1.5"
smallvec = { version = "1.16", features = ["union"] }
uuid = { version = "1.26", default-features = false, optional = true }
sha1 = { version = "0.11", default-features = false, optional = true }
rkyv = { version = "0.8", optional = true, features = ["smallvec-1"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
jiff = { version = "0.2.37", features = ["js"] }

[features]
default = ["jmap", "tzdb-bundle"]
rkyv = ["dep:rkyv"]
serde = ["dep:serde", "smallvec/serde"]
jmap = ["jmap-tools", "uuid", "sha1", "serde", "serde_json"]
tzdb-bundle = ["jiff/tzdb-bundle-always"]

[dev-dependencies]
smallvec = { version = "1.16", features = ["serde"] }
insta = "1.43"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", default-features = false, features = ["v5"] }

[lib]
doctest = false

[patch.crates-io]
jmap-tools = { path = "../jmap-tools" }
